spring:
  application:
    name: cuk-alimi
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cukalimi}
    username: ${DB_USER:cukalimi}
    password: ${DB_PASSWORD:cukalimi}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

# 메일 서버 접속은 헬스에 넣지 않는다. 콘솔 모드나 Gmail 일시 장애로 앱 전체가 DOWN이 되면 안 된다.
management:
  health:
    mail:
      enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  base-url: https://www.catholic.ac.kr
  fetch-interval-ms: 1500
  run-once: ${RUN_ONCE:}
  # 로그인 링크와 화면 주소의 바탕. 로컬은 Next dev 서버, 운영은 Caddy가 받는 도메인
  public-url: ${PUBLIC_URL:http://localhost:3000}
  # 메일 링크가 가리킬 API 주소. 비우면 public-url. 로컬 개발은 http://localhost:8080
  api-url: ${API_URL:}
  admin-email: ${ADMIN_EMAIL:}
  cookie-secure: ${COOKIE_SECURE:false}
  mail:
    mode: ${MAIL_MODE:console}
    from: ${MAIL_FROM:cuk-alimi@localhost}
  digest:
    cron: "0 0 8 * * *"
  schedule:
    cron: "0 0 6 * * *"
    campus: 성심
    years: ${SCHEDULE_YEARS:2026,2027}
  notice:
    cron: "0 7 * * * *"
    # 날짜가 남은 공지의 본문이 바뀌었는지 하루 한 번 본다.
    recheck-cron: "0 30 5 * * *"
    page-size: 30
    categories:
      - name: 학사
        id: 21
      - name: 장학
        id: 22
      - name: 취창업
        id: 23
  # 날짜가 그림에만 있는 공지를 AI가 받아 적는다 (ADR 010). 키가 없으면 꺼진다. 공지 수집(매시 07분) 뒤에 돈다.
  transcribe:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-5-5
    daily-limit: ${TRANSCRIBE_DAILY_LIMIT:40}
    cron: "0 20 * * * *"
  # 공지 글에서 대상 조건(학년·학과·지역)을 AI가 읽는다 (ADR 013). 그림 받아 적기(20분) 뒤에 돌아 받아 적은 글도 함께 읽는다.
  audience-read:
    # 2026-11-03 시험용 공지 69건에서 정규식보다 잘못 칠한 것은 적고 찾은 것은 많아 켠다 (ADR 013).
    enabled: ${AUDIENCE_READ_ENABLED:true}
    model: claude-haiku-5-5
    daily-limit: ${AUDIENCE_READ_DAILY_LIMIT:60}
    cron: "0 35 * * * *"
