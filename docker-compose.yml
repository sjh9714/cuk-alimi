services:
  postgres:
    image: postgres:16-alpine
    container_name: cukalimi-postgres
    environment:
      POSTGRES_DB: cukalimi
      POSTGRES_USER: cukalimi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cukalimi}
    ports:
      - "5432:5432"
    volumes:
      - cukalimi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cukalimi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cukalimi_pgdata:
